name: Deploy Vue Website

on:
  push:
    branches: [main] # 如果你的分支叫 master，請改為 master

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and Build
        run: |
          npm install
          npm run build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Vue 打包後產生的資料夾名稱
          branch: gh-pages # 這是它會自動幫你建立的部署分支
